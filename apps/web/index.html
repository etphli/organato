<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="Organato is a private school workload command centre."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/icons/icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="mask-icon" href="/icons/icon-monochrome.svg" color="#0b0b0c" />
    <link rel="stylesheet" href="/boot.css" />
    <title>Organato</title>
  </head>
  <body>
    <noscript>
      <p style="padding: 32px; text-align: center">
        Organato needs JavaScript to open your workspace.
      </p>
    </noscript>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="Opening Organato">
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
          "
          >Opening Organato</span
        >
        <aside class="boot-rail" aria-hidden="true">
          <span class="boot-mark"><i></i></span>
          <span class="boot-nav boot-nav-active"></span>
          <span class="boot-nav"></span>
          <span class="boot-nav"></span>
          <span class="boot-nav"></span>
          <span class="boot-nav"></span>
        </aside>
        <main class="boot-main" aria-hidden="true">
          <div class="boot-heading">
            <span></span>
            <i></i>
          </div>
          <div class="boot-rule"></div>
          <div class="boot-row">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="boot-row">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="boot-row">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </main>
      </div>
    </div>
    <script src="/recovery.js"></script>
    <script src="/ato-connect.js" defer data-ato-app="organato"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
